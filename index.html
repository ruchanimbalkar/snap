<!DOCTYPE html>
<html>
  <head>
    <title>LA TV Shows | Home</title>
    <meta name="description" content="A Catalog of Shows Set in Los Angeles" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="scripts.js"></script>
  </head>

  <body>
    <header class="main-header">
      <h1 class="title">LA TV Shows</h1>
      <form id="show-form">
        <label for="showTitle">
          Show Title
          <input type="text" name="title" id="showTitle" />
        </label>
        <button type="submit">Search</button>
      </form>
      <button id="asc-order">Sort &#8593;</button>
      <button id="desc-order">Sort &#8595;</button>
      <button id="family">Family Friendly</button>
    </header>
    <div id="card-container"></div>
    <div class="card" style="display: none">
      <div class="card-content">
        <h2>TV Show Title</h2>
        <img src="" alt="TV Show Poster" />
        <ul>
          <li>Bullet Point 1</li>
          <li>Bullet Point 2</li>
          <li>Bullet Point 3</li>
        </ul>
      </div>
    </div>
    <div class="footer">
      <button id="quote-button">Get A Quote!</button>
      <button id="remove-card">Remove A Card!</button>
    </div>
  </body>
</html>
